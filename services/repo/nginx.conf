# The repo backend is unpublished on its private network with Traefik, which
# appends the connecting client's address to X-Forwarded-For. Use the last hop.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

# Keep most clients at 1 request per second per IP, with a burst of 1,000
# and 10 wait slots (up to 10 seconds) so crawlers slow down sooner.
# The empty key lets pacman/ and vcpkg/ skip this tighter limit.
map $http_user_agent $repo_generic_limit_key {
    default $binary_remote_addr;
    ~^(pacman|vcpkg)/ "";
}
limit_req_zone $repo_generic_limit_key zone=repo_generic_clients:10m rate=1r/s;
limit_req zone=repo_generic_clients burst=1010 delay=1000;

# Give pacman and vcpkg more room. All requests from the same IP still share
# a limit of 5 requests per second, a burst of 5,000, and 5 wait slots (up to
# 1 second).
# Pacman's default 5 parallel downloads slow down without getting a 429,
# as long as nothing else on the same IP is using the queue.
limit_req_zone $binary_remote_addr zone=repo_all_clients:10m rate=5r/s;
limit_req zone=repo_all_clients burst=5005 delay=5000;

# If either queue fills, send a 429 with Retry-After.
limit_req_status 429;
# Traefik's access log already records the 429 responses.
limit_req_log_level info;

autoindex on;
autoindex_exact_size off;
absolute_redirect off;
gzip on;
access_log off;
map $status $repo_retry_after {
    default "";
    429 1;
}
add_header Retry-After $repo_retry_after always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;
add_header X-Content-Type-Options "nosniff" always;
