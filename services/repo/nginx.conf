# The repo backend is unpublished on its private network with Traefik, which
# appends the connecting client's address to X-Forwarded-For. Use the last hop.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;

# Give big installs some room: requests from the same IP share a burst of
# 5,000. Keep other clients at 1,000 so crawlers hit the limit sooner.
# The empty key lets pacman/ and vcpkg/ skip the 1,000-request limit.
# Both limits refill at 1 request per second. If either runs out, send a
# 429 instead of making the client wait.
map $http_user_agent $repo_generic_ip {
    default $binary_remote_addr;
    ~^(pacman|vcpkg)/ "";
}

limit_req_zone $binary_remote_addr zone=repo_per_ip:10m rate=1r/s;
limit_req_zone $repo_generic_ip zone=repo_generic_per_ip:10m rate=1r/s;
limit_req zone=repo_generic_per_ip burst=1000 nodelay;
limit_req zone=repo_per_ip burst=5000 nodelay;
limit_req_status 429;
# Traefik's access log already records the 429 responses.
limit_req_log_level info;

autoindex on;
autoindex_exact_size off;
absolute_redirect off;
gzip on;
access_log off;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';" always;
add_header X-Content-Type-Options "nosniff" always;
